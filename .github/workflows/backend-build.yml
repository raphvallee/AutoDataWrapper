# This workflow will do a clean installation of bun dependencies, cache/restore them, build the source code and run tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.bun-version'
  pull_request:
    paths:
      - 'backend/**'
      - '.bun-version'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version
    - name: Install dependencies
      working-directory: backend
      run: bun install --frozen-lockfile

    - name: Build
      working-directory: backend
      run: bun run build

    # `bun run build` is only tsc, which never loads the native addon, so a green
    # build proves nothing about the data layer. This actually connects TypeORM to
    # SQLite and round-trips a write.
    - name: Smoke check TypeORM + better-sqlite3
      working-directory: backend
      run: bun run smoke:sqlite
