<p>model works!</p>

@if (model?.name) {
  <p>Showing generations for {{ model.name }}</p>
} @else {
  <p>Showing generations for ...</p>
}


@if (loading) {
  <p>Fetching generations...</p>
} @else if (generations.length === 0) {
  <p>No generations found.</p>
} @else {
  @for (item of generations; track item) {
    <app-model-item [item]="item"/>
  }
}
