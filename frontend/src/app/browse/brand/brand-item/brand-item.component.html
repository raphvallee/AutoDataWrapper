<a class="row" [routerLink]="[slug()]">
  <span class="row__mark" aria-hidden="true"></span>
  <img class="row__thumb" [alt]="" [src]="item.imageUrl"
       (error)="onImageError($event)" loading="lazy"/>
  <span class="row__body">
    <span class="row__name">{{ item.name }}</span>
    <!-- Shown only while a model is still being built. Repeating "production
         ended" on every row says nothing, and it dulls the one amber mark that
         does carry information. -->
    @if (inProduction()) {
      <span class="prod prod--live">In production</span>
    }
  </span>
  <span class="row__aside">
    <span class="row__years">{{ years() }}</span>
  </span>
</a>
