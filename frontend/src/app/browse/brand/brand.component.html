<p>brand works!</p>

@if (brand?.name) {
  <p>Showing models for {{ brand.name }}</p>
} @else {
  <p>Showing models for ...</p>
}

<div class="models-container">
  @if (loading) {
    <p>Fetching models...</p>
  } @else if (models.length === 0) {
    <p>No models found.</p>
  } @else {
    @for (item of models; track item) {
      <app-brand-item [item]="item"/>
    }
  }
</div>
