<p>generation works!</p>

@if (generation?.name) {
  <p>Showing trims for {{ generation.name }}</p>
} @else {
  <p>Showing trims for ...</p>
}


@if (loading) {
  <p>Fetching trims...</p>
} @else if (trims.length === 0) {
  <p>No trims found.</p>
} @else {
  @for (item of trims; track item) {
    <app-generation-item [item]="item"/>
  }
}
